[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boyue"
version = "1.0.0"
description = "BoYue: Directed GRN inference from scRNA-seq via Graph Transformer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.9",
    "scanpy>=1.9",
    "statsmodels>=0.14",
    "gseapy>=1.0",
]

[project.scripts]
boyue-disease = "boyue.cli:main_disease"
boyue-enrich = "boyue.cli:main_enrich"

[tool.setuptools.packages.find]
include = ["boyue*"]
